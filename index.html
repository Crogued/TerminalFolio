<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christian Rodrigues | PortfolioShell</title>
    <link rel="stylesheet" href="./src/styles/styles.css?v=24">
    <meta name="description" content="Christian Rodrigues – AI & Robotics Software Engineer. Interactive terminal-style portfolio showcasing projects, experience, and skills in Computer Vision, Deep Learning, and autonomous systems.">
    <link rel="shortcut icon" href="terminal_folio.png" type="image/png">
    <link rel="icon" href="terminal_folio.png" type="image/png">
</head>

<body>
    <div id="floating-objects">
        <div class="bubble-wrapper obj-1">
            <div class="glass-bubble shape-1"></div>
            <!-- AI (Digital Brain & Circuits) SVG -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="bubble-icon">
                <path d="M12 5a3 3 0 1 0-5.197-3 5 5 0 0 0-5.196 6.5A3.5 3.5 0 0 0 2.5 15a4.5 4.5 0 0 0 5.5 6.5c1 .5 2.2.5 3.3.1a2 2 0 0 0 .7-.6"></path>
                <path d="M12 5a3 3 0 1 1 5.197-3 5 5 0 0 1 5.196 6.5A3.5 3.5 0 0 1 21.5 15a4.5 4.5 0 0 1-5.5 6.5c-1 .5-2.2.5-3.3.1a2 2 0 0 1-.7-.6"></path>
                <path d="M12 5v13"></path>
                <path d="M12 8h4v2M12 12h-4v2M12 15h3"></path>
                <circle cx="16" cy="10" r="0.8" fill="currentColor"></circle>
                <circle cx="8" cy="14" r="0.8" fill="currentColor"></circle>
                <circle cx="15" cy="15" r="0.8" fill="currentColor"></circle>
            </svg>
        </div>
        <div class="bubble-wrapper obj-2">
            <div class="glass-bubble shape-2"></div>
            <!-- Advanced Robotics (Precision Robotic Arm) SVG -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="bubble-icon">
                <path d="M4 20h16M7 20v-1.5a2.5 2.5 0 0 1 2.5-2.5h5a2.5 2.5 0 0 1 2.5 2.5v1.5"></path>
                <circle cx="12" cy="13.5" r="2"></circle>
                <path d="M12 11.5L9.5 6.5"></path>
                <circle cx="9.5" cy="6.5" r="1.5"></circle>
                <path d="M11 6.5L16 4.5"></path>
                <path d="M16 4.5l1.5-1.5M16 4.5l1.5 1.5 M18 3v3"></path>
            </svg>
        </div>
        <div class="bubble-wrapper obj-3">
            <div class="glass-bubble shape-3"></div>
            <!-- Quantum Computing (Tesseract Cube) SVG -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="bubble-icon">
                <rect x="3" y="3" width="11" height="11" rx="1.5"></rect>
                <rect x="10" y="10" width="11" height="11" rx="1.5"></rect>
                <line x1="14" y1="3" x2="21" y2="10"></line>
                <line x1="3" y1="14" x2="10" y2="21"></line>
                <line x1="3" y1="3" x2="10" y2="10"></line>
                <line x1="14" y1="14" x2="21" y2="21"></line>
                <circle cx="12" cy="12" r="1.5" fill="currentColor"></circle>
                <line x1="12" y1="7" x2="12" y2="9.5"></line>
                <line x1="12" y1="14.5" x2="12" y2="17"></line>
                <line x1="7" y1="12" x2="9.5" y2="12"></line>
                <line x1="14.5" y1="12" x2="17" y2="12"></line>
            </svg>
        </div>
    </div>
    <div id="terminal-container">
        <div id="terminal">
            <div class="terminal-header">
                <div class="window-controls">
                    <div class="control close"></div>
                    <div class="control minimize"></div>
                    <div class="control maximize"></div>
                </div>
                <button id="tutorial-btn" class="tutorial-btn">Tutorial</button>
                <div class="terminal-title">crogued@portfolio: ~/home</div>
            </div>
            <div id="terminal-body">
                <div id="terminal-output"></div>
                <div id="loader" style="display: none;"></div>
                <div id="input-line">
                    <span id="prompt">crogued@portfolio:~ $</span>
                    <input type="text" id="command-line" autocomplete="off" autofocus>
                </div>
            </div>
        </div>
    </div>

    <!-- Tutorial Modal -->
    <div id="tutorial-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div class="video-container">
                <iframe width="560" height="315" src="https://www.youtube.com/embed/kTmaIkxjaQA?si=dIqqvHXql9kLz4Zh" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script src="./src/js/script.js?v=21"></script>
</body>

</html>
